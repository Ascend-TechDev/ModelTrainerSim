[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-trainer-simulator"
version = "0.1.0"
description = "LLM architecture parameter & memory modeling toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ModelTrainerSimulator Contributors"}]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
excel = [
    "openpyxl>=3.1",
    "pandas>=2.0",
]

[project.scripts]
mtsim = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"src.models.dsv41flash" = ["config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]